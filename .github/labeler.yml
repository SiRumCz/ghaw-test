# Configuration for the labeler action (v5 format)
# https://github.com/actions/labeler

# Label for Python source code changes
'python':
  - changed-files:
      - any-glob-to-any-file: '**/*.py'

# Label for test changes
'tests':
  - changed-files:
      - any-glob-to-any-file: 'tests/**/*'

# Label for documentation changes
'documentation':
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.md'
          - 'docs/**/*'

# Label for GitHub Actions workflow changes
'github-actions':
  - changed-files:
      - any-glob-to-any-file: '.github/**/*'

# Label for dependency changes
'dependencies':
  - changed-files:
      - any-glob-to-any-file:
          - 'requirements.txt'
          - 'requirements-dev.txt'
          - 'setup.py'
          - 'pyproject.toml'
