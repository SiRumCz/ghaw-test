name: Code Quality

on:
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Set up uv
      uses: astral-sh/setup-uv@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: uv sync

    - name: Check formatting with black
      run: |
        uv run black --check src/ tests/ || echo "BLACK_FAILED=true" >> $GITHUB_ENV

    - name: Check import sorting with isort
      run: |
        uv run isort --check-only src/ tests/ || echo "ISORT_FAILED=true" >> $GITHUB_ENV

    - name: Lint with flake8
      run: |
        uv run flake8 src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics || echo "FLAKE8_FAILED=true" >> $GITHUB_ENV

    - name: Comment on PR with results
      if: always()
      uses: actions/github-script@v7
      with:
        script: |
          const blackFailed = process.env.BLACK_FAILED === 'true';
          const isortFailed = process.env.ISORT_FAILED === 'true';
          const flake8Failed = process.env.FLAKE8_FAILED === 'true';

          if (blackFailed || isortFailed || flake8Failed) {
            let message = '## 🚨 Code Quality Issues\n\n';

            if (blackFailed) {
              message += '- ❌ **Black**: Code formatting issues detected\n';
              message += '  - Run `uv run black src/ tests/` to fix\n\n';
            }

            if (isortFailed) {
              message += '- ❌ **isort**: Import sorting issues detected\n';
              message += '  - Run `uv run isort src/ tests/` to fix\n\n';
            }

            if (flake8Failed) {
              message += '- ❌ **Flake8**: Linting errors detected\n';
              message += '  - Check the workflow logs for details\n\n';
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: message
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '## ✅ Code Quality Check Passed!\n\nAll linting and formatting checks passed successfully.'
            });
          }
