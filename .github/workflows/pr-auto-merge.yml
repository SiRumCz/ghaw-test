name: Auto Merge PR

on:
  pull_request:
    types: [labeled, unlabeled, synchronize, reopened]
  pull_request_review:
    types: [submitted]
  check_suite:
    types: [completed]

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write

    steps:
    - name: Auto-merge dependabot PRs
      if: github.actor == 'dependabot[bot]'
      uses: actions/github-script@v7
      with:
        script: |
          // Check if PR has the 'auto-merge' label or is from dependabot
          const { data: pr } = await github.rest.pulls.get({
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: context.issue.number,
          });

          // Check if all checks have passed
          const { data: checks } = await github.rest.checks.listForRef({
            owner: context.repo.owner,
            repo: context.repo.repo,
            ref: pr.head.sha,
          });

          const allChecksPassed = checks.check_runs.every(
            check => check.conclusion === 'success' || check.conclusion === 'skipped'
          );

          if (allChecksPassed && pr.mergeable) {
            await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              merge_method: 'squash',
            });

            console.log('PR auto-merged successfully!');
          }

  auto-approve-minor:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    permissions:
      pull-requests: write

    steps:
    - name: Auto-approve minor dependabot updates
      uses: actions/github-script@v7
      with:
        script: |
          const { data: pr } = await github.rest.pulls.get({
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: context.issue.number,
          });

          // Check if it's a minor or patch update
          const title = pr.title.toLowerCase();
          if (title.includes('minor') || title.includes('patch')) {
            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              event: 'APPROVE',
              body: '🤖 Auto-approving minor/patch version update'
            });
          }
