name: Auto Label

on:
  pull_request:
    types: [opened, edited, synchronize]
  issues:
    types: [opened, edited]

jobs:
  label-pr:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Label PR based on changed files
      uses: actions/labeler@v5
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Label PR based on size
      uses: pascalgn/size-label-action@v0.5.3
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  label-issue:
    runs-on: ubuntu-latest
    if: github.event_name == 'issues'
    permissions:
      issues: write

    steps:
    - name: Auto-label issues based on keywords
      uses: actions/github-script@v7
      with:
        script: |
          const body = context.payload.issue.body || '';
          const title = context.payload.issue.title || '';
          const text = (title + ' ' + body).toLowerCase();

          const labels = [];

          if (text.includes('bug') || text.includes('error') || text.includes('broken')) {
            labels.push('bug');
          }
          if (text.includes('feature') || text.includes('enhancement')) {
            labels.push('enhancement');
          }
          if (text.includes('documentation') || text.includes('docs')) {
            labels.push('documentation');
          }
          if (text.includes('question') || text.includes('help')) {
            labels.push('question');
          }
          if (text.includes('test')) {
            labels.push('testing');
          }

          if (labels.length > 0) {
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: labels
            });
          }
